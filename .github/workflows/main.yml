
name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Project Configuration
        run: |
          test -f package.json || { echo "ERROR: package.json is missing"; exit 1; }
          node -e "const p=require('./package.json'); console.log('Build script:', p.scripts?.build || 'MISSING'); console.log('Capacitor CLI:', p.dependencies?.['@capacitor/cli'] || p.devDependencies?.['@capacitor/cli'] || 'MISSING'); console.log('Capacitor Android:', p.dependencies?.['@capacitor/android'] || p.devDependencies?.['@capacitor/android'] || 'MISSING');"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Verify Capacitor CLI
        run: npx cap --version

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload DLNE Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DLNE-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
