name: Build Dalani Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_description:
        description: 'Build notes / trigger reason'
        required: false
        default: 'Manual trigger from GitHub Actions'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build & Package Dalani Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Node.js Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Validate TypeScript Codebase
        run: npm run lint

      - name: 5. Build Vite Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: 6. Sync Web Assets with Capacitor Android
        run: npx cap sync android

      - name: 7. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 8. Ensure Gradle Wrapper is Executable
        run: chmod +x android/gradlew

      - name: 9. Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 10. Verify APK Output
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK file not found at expected path: $APK_PATH"
            exit 1
          fi
          echo "=================================================="
          echo " Dalani Android Debug APK Successfully Created!  "
          echo " Path: $APK_PATH"
          echo " Size: $(du -h "$APK_PATH" | cut -f1)"
          echo "=================================================="
          ls -lh "$APK_PATH"

      - name: 11. Upload Dalani Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dalani-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
